<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>test-local-llm</title>
  <style>
    :root { --bg: #0f1115; --fg: #e6e6e6; --muted: #9aa0a6; --border: #2a2f3a; --accent: #7aa2f7; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-system, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--fg); }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 16px; margin: 0; letter-spacing: 0.02em; }
    header span { color: var(--muted); font-size: 13px; }
    main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 53px); }
    aside { border-right: 1px solid var(--border); padding: 16px; }
    .panel { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
    .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    #chat { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 760px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); }
    .msg.user { align-self: flex-end; background: #1a1f2e; border-color: #2a3350; }
    .msg.assistant { align-self: flex-start; background: #171a20; }
    footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    input, button, select, textarea { font: inherit; }
    input, select, textarea { background: #171a20; color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    button { background: var(--accent); color: #0b1020; border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .small { font-size: 12px; color: var(--muted); }
    .engine-row { margin-bottom: 12px; }
    .engine-header { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .engine-result { margin-top:6px; white-space:pre-wrap; }
    .engine-result.success { color:#9ece6a; }
    .engine-result.failure { color:#f7768e; }
    #test-all { width:100%; margin-bottom:10px; }
  </style>
</head>
<body>
  <header>
    <h1>test-local-llm</h1>
    <span id="health">checking health…</span>
  </header>
  <main>
    <aside>
      <div class="panel">
        <h2>Conversations</h2>
        <form id="new-conversation">
          <input name="title" placeholder="Title" required style="width:100%; margin-bottom:8px" />
          <select name="engine_key" required style="width:100%; margin-bottom:8px">
            <option value="ollama">Ollama</option>
            <option value="vllm">vLLM</option>
            <option value="sglang">SGLang</option>
            <option value="llamacpp">llama.cpp</option>
          </select>
          <button type="submit">New conversation</button>
        </form>
        <div id="conversations" style="margin-top:12px"></div>
      </div>
      <div class="panel">
        <h2>Engines</h2>
        <button id="test-all" type="button">Test all</button>
        <div id="engines"><div class="small">Loading engines…</div></div>
      </div>
    </aside>
    <section id="chat">
      <div class="msg assistant">Select a conversation to start chatting.</div>
    </section>
  </main>
  <footer>
    <input id="prompt" placeholder="Message" style="flex:1" />
    <button id="send">Send</button>
    <button id="cancel" hidden>Cancel</button>
  </footer>

  <script>
    const conversationList = document.getElementById('conversations');
    const chat = document.getElementById('chat');
    const prompt = document.getElementById('prompt');
    const send = document.getElementById('send');
    const cancel = document.getElementById('cancel');
    const enginesPanel = document.getElementById('engines');
    const testAll = document.getElementById('test-all');
    let activeConversation = null;
    let controller = null;

    function appendMessage(role, content = '') {
      const message = document.createElement('div');
      message.className = `msg ${role}`;
      message.textContent = content;
      chat.appendChild(message);
      return message;
    }

    async function showConversation(conversation) {
      activeConversation = conversation;
      chat.innerHTML = '';
      appendMessage('assistant', `${conversation.title}\n${conversation.engine_key} · ${conversation.model}`);
      const response = await fetch(`/api/conversations/${conversation.id}/messages`);
      (await response.json()).forEach(message => appendMessage(message.role, message.content));
    }

    function updateEngineResult(engineKey, result) {
      const resultNode = document.querySelector(`[data-engine-result="${engineKey}"]`);
      if (!resultNode) return;
      if (result.content) resultNode.textContent += result.content;
      if (result.error_type) {
        resultNode.className = 'engine-result failure';
        resultNode.textContent = `${result.error_type}: ${result.message}`;
      } else if (result.success && result.content) {
        resultNode.className = 'engine-result success';
      }
    }

    async function runSmokeTest(url, buttons) {
      buttons.forEach(button => { button.disabled = true; });
      try {
        const response = await fetch(url, { method: 'POST' });
        if (!response.ok) throw new Error((await response.json()).detail);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split('\n\n');
          buffer = events.pop();
          events.forEach(event => {
            const data = event.split('\n').find(line => line.startsWith('data: '));
            if (data) updateEngineResult(JSON.parse(data.slice(6)).engine_key, JSON.parse(data.slice(6)));
          });
        }
      } catch (error) {
        const key = url === '/api/engines/smoke-test' ? null : url.split('/api/engines/')[1].split('/')[0];
        const keys = key ? [key] : [...document.querySelectorAll('[data-engine-result]')].map(node => node.dataset.engineResult);
        keys.forEach(engineKey => updateEngineResult(engineKey, { error_type: 'request_error', message: error.message }));
      } finally {
        buttons.forEach(button => { button.disabled = false; });
      }
    }

    async function loadEngines() {
      const response = await fetch('/api/engines');
      const engines = await response.json();
      const select = document.querySelector('[name="engine_key"]');
      select.innerHTML = '';
      engines.forEach(engine => {
        if (engine.enabled) select.append(new Option(engine.name, engine.key));
      });
      enginesPanel.innerHTML = '';
      engines.forEach(engine => {
        const row = document.createElement('div');
        row.className = 'engine-row';
        row.innerHTML = `<div class="engine-header"><strong>${engine.name}</strong><span class="small">${engine.status}</span></div><button type="button" ${engine.enabled ? '' : 'disabled'}>Test</button><div class="engine-result small" data-engine-result="${engine.key}"></div>`;
        const button = row.querySelector('button');
        button.addEventListener('click', () => {
          row.querySelector('[data-engine-result]').textContent = '';
          runSmokeTest(`/api/engines/${engine.key}/smoke-test`, [button, testAll]);
        });
        enginesPanel.appendChild(row);
      });
    }

    async function loadConversations() {
      const response = await fetch('/api/conversations');
      const conversations = await response.json();
      conversationList.innerHTML = '';
      conversations.forEach(conversation => {
        const item = document.createElement('div');
        item.className = 'small';
        item.style = 'display:flex; gap:6px; align-items:center; margin-bottom:8px';
        const openButton = document.createElement('button');
        openButton.type = 'button';
        openButton.style = 'flex:1; text-align:left';
        openButton.textContent = conversation.title;
        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.setAttribute('aria-label', `Delete ${conversation.title}`);
        deleteButton.textContent = '×';
        item.append(openButton, deleteButton);
        openButton.addEventListener('click', () => showConversation(conversation));
        deleteButton.addEventListener('click', async () => {
          await fetch(`/api/conversations/${conversation.id}`, { method: 'DELETE' });
          if (activeConversation?.id === conversation.id) {
            activeConversation = null;
            chat.innerHTML = '';
          }
          await loadConversations();
        });
        conversationList.appendChild(item);
      });
    }

    document.getElementById('new-conversation').addEventListener('submit', async event => {
      event.preventDefault();
      const form = new FormData(event.target);
      const response = await fetch('/api/conversations', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: form.get('title'), engine_key: form.get('engine_key') })
      });
      if (response.ok) {
        const conversation = await response.json();
        event.target.reset();
        await loadConversations();
        await showConversation(conversation);
      } else alert((await response.json()).detail);
    });

    async function sendMessage() {
      if (!activeConversation || !prompt.value.trim() || controller) return;
      const content = prompt.value.trim();
      prompt.value = '';
      appendMessage('user', content);
      const assistant = appendMessage('assistant');
      controller = new AbortController();
      send.disabled = true;
      cancel.hidden = false;
      try {
        const response = await fetch(`/api/conversations/${activeConversation.id}/messages`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content }), signal: controller.signal
        });
        if (!response.ok) throw new Error((await response.text()) || `Request failed (${response.status})`);
        if (!response.body) throw new Error('Engine returned no stream');
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split('\n\n');
          buffer = events.pop();
          events.forEach(event => {
            const data = event.split('\n').find(line => line.startsWith('data: '));
            if (!data || data === 'data: [DONE]') return;
            if (event.startsWith('event: error')) throw new Error(JSON.parse(data.slice(6)).message);
            assistant.textContent += JSON.parse(data.slice(6)).content || '';
          });
        }
      } catch (error) {
        if (error.name !== 'AbortError') assistant.textContent += `\n[Error: ${error.message}]`;
      } finally {
        controller = null;
        send.disabled = false;
        cancel.hidden = true;
      }
    }

    testAll.addEventListener('click', () => {
      document.querySelectorAll('[data-engine-result]').forEach(node => { node.textContent = ''; node.className = 'engine-result small'; });
      runSmokeTest('/api/engines/smoke-test', [testAll, ...document.querySelectorAll('.engine-row button')]);
    });
    send.addEventListener('click', sendMessage);
    prompt.addEventListener('keydown', event => { if (event.key === 'Enter') sendMessage(); });
    cancel.addEventListener('click', () => controller?.abort());
    loadConversations();
    loadEngines().catch(() => { enginesPanel.textContent = 'Engine inventory failed'; });
    fetch('/api/health').then(r => r.json()).then(j => { document.getElementById('health').textContent = j.status === 'ok' ? 'ok' : JSON.stringify(j); }).catch(() => { document.getElementById('health').textContent = 'health check failed'; });
  </script>
</body>
</html>
