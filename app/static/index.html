<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>test-local-llm</title>
  <style>
    :root { --bg: #0f1115; --fg: #e6e6e6; --muted: #9aa0a6; --border: #2a2f3a; --accent: #7aa2f7; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-system, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--fg); }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 16px; margin: 0; letter-spacing: 0.02em; }
    header span { color: var(--muted); font-size: 13px; }
    main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 53px); }
    aside { border-right: 1px solid var(--border); padding: 16px; }
    .panel { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
    .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    #chat { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 760px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); }
    .msg.user { align-self: flex-end; background: #1a1f2e; border-color: #2a3350; }
    .msg.assistant { align-self: flex-start; background: #171a20; }
    footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    input, button, select, textarea { font: inherit; }
    input, select, textarea { background: #171a20; color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    button { background: var(--accent); color: #0b1020; border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .small { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>test-local-llm</h1>
    <span id="health">checking health…</span>
  </header>
  <main>
    <aside>
      <div class="panel">
        <h2>Conversations</h2>
        <div class="small">Persisted threads pinned to one Engine + Model.</div>
      </div>
      <div class="panel">
        <h2>Engines</h2>
        <div class="small">Configured in <code>config.toml</code>. Health via <code>/v1/models</code>.</div>
      </div>
    </aside>
    <section id="chat">
      <div class="msg assistant">App shell ready. Engine chat and SSE streaming land in the next slice.</div>
    </section>
  </main>
  <footer>
    <input id="prompt" placeholder="Message (wired in a later slice)" style="flex:1" />
    <button disabled>Send</button>
  </footer>
  <script>
    fetch('/api/health').then(r => r.json()).then(j => {
      document.getElementById('health').textContent = j.status === 'ok' ? 'ok' : JSON.stringify(j);
    }).catch(e => {
      document.getElementById('health').textContent = 'health check failed';
    });
  </script>
</body>
</html>
