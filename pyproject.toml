[project]
name = "test-local-llm"
version = "0.1.0"
description = "A general-purpose local chatbot for exercising local LLM serving engines (Ollama, vLLM, SGLang, llama.cpp) over the OpenAI-compatible API."
authors = [{ name = "USER" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.115)",
    "uvicorn[standard] (>=0.30)",
    "httpx (>=0.27)",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
