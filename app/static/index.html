<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>test-local-llm</title>
  <style>
    :root { --bg: #0f1115; --fg: #e6e6e6; --muted: #9aa0a6; --border: #2a2f3a; --accent: #7aa2f7; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-system, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--fg); }
    header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 16px; margin: 0; letter-spacing: 0.02em; }
    header span { color: var(--muted); font-size: 13px; }
    main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 53px); }
    aside { border-right: 1px solid var(--border); padding: 16px; }
    .panel { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 16px; }
    .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    #chat { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 760px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); }
    .msg.user { align-self: flex-end; background: #1a1f2e; border-color: #2a3350; }
    .msg.assistant { align-self: flex-start; background: #171a20; }
    footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    input, button, select, textarea { font: inherit; }
    input, select, textarea { background: #171a20; color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    button { background: var(--accent); color: #0b1020; border: none; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .small { font-size: 12px; color: var(--muted); }
    .engine { border-top: 1px solid var(--border); padding: 10px 0; }
    .engine:first-child { border-top: 0; padding-top: 0; }
    .engine-head { display: flex; justify-content: space-between; gap: 8px; }
    .engine-name { font-weight: 600; }
    .status { font-size: 11px; text-transform: uppercase; }
    .status.up { color: #8bd5a5; }
    .status.down { color: #f28b82; }
    .status.disabled { color: var(--muted); }
    .engine-meta { margin-top: 4px; }
    .command { margin-top: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .copy-command { margin-top: 6px; padding: 5px 8px; font-size: 11px; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--border); } }
  </style>
</head>
<body>
  <header>
    <h1>test-local-llm</h1>
    <span id="health">checking health…</span>
  </header>
  <main>
    <aside>
      <div class="panel">
        <h2>Conversations</h2>
        <form id="new-conversation">
          <input name="title" placeholder="Title" required style="width:100%; margin-bottom:8px" />
          <select name="engine_key" required style="width:100%; margin-bottom:8px">
            <option value="ollama">Ollama</option>
            <option value="vllm">vLLM</option>
            <option value="sglang">SGLang</option>
            <option value="llamacpp">llama.cpp</option>
          </select>
          <button type="submit">New conversation</button>
        </form>
        <div id="conversations" style="margin-top:12px"></div>
      </div>
      <div class="panel">
        <h2>Engines</h2>
        <div class="small">Configured in <code>config.toml</code>. Health via <code>/v1/models</code>.</div>
        <div id="engines" aria-live="polite" style="margin-top: 8px">checking engines…</div>
      </div>
    </aside>
    <section id="chat">
      <div class="msg assistant">App shell ready. Engine chat and SSE streaming land in the next slice.</div>
    </section>
  </main>
  <footer>
    <input id="prompt" placeholder="Message (wired in a later slice)" style="flex:1" />
    <button disabled>Send</button>
  </footer>
  <script>
    const conversationList = document.getElementById('conversations');
    const chat = document.getElementById('chat');

    function showConversation(conversation) {
      chat.innerHTML = '';
      const message = document.createElement('div');
      message.className = 'msg assistant';
      const title = document.createElement('strong');
      title.textContent = conversation.title;
      const metadata = document.createElement('span');
      metadata.className = 'small';
      metadata.textContent = `${conversation.engine_key} · ${conversation.model}`;
      const prompt = document.createElement('span');
      prompt.textContent = conversation.system_prompt || 'No system prompt.';
      message.append(title, document.createElement('br'), metadata, document.createElement('br'), prompt);
      chat.appendChild(message);
    }

    async function loadConversations() {
      const response = await fetch('/api/conversations');
      const conversations = await response.json();
      conversationList.innerHTML = '';
      conversations.forEach(conversation => {
        const item = document.createElement('div');
        item.className = 'small';
        item.style = 'display:flex; gap:6px; align-items:center; margin-bottom:8px';
        const openButton = document.createElement('button');
        openButton.type = 'button';
        openButton.style = 'flex:1; text-align:left';
        openButton.textContent = conversation.title;
        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.setAttribute('aria-label', `Delete ${conversation.title}`);
        deleteButton.textContent = '×';
        item.append(openButton, deleteButton);
        openButton.addEventListener('click', () => showConversation(conversation));
        deleteButton.addEventListener('click', async () => {
          await fetch(`/api/conversations/${conversation.id}`, { method: 'DELETE' });
          await loadConversations();
        });
        conversationList.appendChild(item);
      });
    }

    document.getElementById('new-conversation').addEventListener('submit', async event => {
      event.preventDefault();
      const form = new FormData(event.target);
      const response = await fetch('/api/conversations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: form.get('title'), engine_key: form.get('engine_key') })
      });
      if (response.ok) {
        const conversation = await response.json();
        event.target.reset();
        await loadConversations();
        showConversation(conversation);
      } else {
        alert((await response.json()).detail);
      }
    });

    loadConversations();
    fetch('/api/health').then(r => r.json()).then(j => {
      document.getElementById('health').textContent = j.status === 'ok' ? 'ok' : JSON.stringify(j);
    }).catch(e => {
      document.getElementById('health').textContent = 'health check failed';
    });

    const enginesElement = document.getElementById('engines');
    const renderEngines = engines => {
      enginesElement.replaceChildren(...engines.map(engine => {
        const element = document.createElement('div');
        element.className = 'engine';
        const head = document.createElement('div');
        head.className = 'engine-head';
        const name = document.createElement('span');
        name.className = 'engine-name';
        name.textContent = engine.name;
        const status = document.createElement('span');
        status.className = `status ${engine.status}`;
        status.textContent = engine.status;
        head.append(name, status);
        const meta = document.createElement('div');
        meta.className = 'small engine-meta';
        meta.textContent = `${engine.base_url} · ${engine.model}`;
        element.append(head, meta);
        if (engine.status === 'down') {
          for (const [label, command] of [['Host', engine.start_command], ['WSL', engine.wsl_start_command]]) {
            const commandElement = document.createElement('div');
            commandElement.className = 'small command';
            commandElement.textContent = `${label}: ${command}`;
            const button = document.createElement('button');
            button.className = 'copy-command';
            button.type = 'button';
            button.textContent = `Copy ${label}`;
            button.addEventListener('click', () => navigator.clipboard.writeText(command));
            element.append(commandElement, button);
          }
        }
        return element;
      }));
    };
    const refreshEngines = () => fetch('/api/engines').then(response => response.json()).then(renderEngines).catch(() => {
      enginesElement.textContent = 'engine health unavailable';
    });
    refreshEngines();
    setInterval(refreshEngines, 10000);
  </script>
</body>
</html>
