# Engine configuration for test-local-llm.
#
# An engine is a config entry, never a code adapter (see docs/adr/0001).
# base_url is the OpenAI-compatible root (must end in /v1).
# model is that engine's own name for Qwen3.5-4B.

[app]
host = "127.0.0.1"
port = 8765
smoke_prompt = "Reply with exactly one word: pong"

[engines.ollama]
name = "Ollama"
base_url = "http://127.0.0.1:11434/v1"
model = "qwen3.5:4b"
enabled = true

[engines.vllm]
name = "vLLM"
base_url = "http://127.0.0.1:8000/v1"
model = "qwen3.5-4b"
enabled = true

[engines.sglang]
name = "SGLang"
base_url = "http://127.0.0.1:30000/v1"
model = "qwen3.5-4b"
enabled = true

[engines.llamacpp]
name = "llama.cpp"
base_url = "http://127.0.0.1:8080/v1"
model = "qwen3.5-4b"
enabled = true
